name: Check Skill Validation
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Check skill validation
        run: scripts/check-validation
